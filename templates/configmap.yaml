apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "springboot-app.configMapName" . }}
  labels:
    {{- include "springboot-app.labels" . | nindent 4 }}
data:
  SPRING_PROFILES_ACTIVE: {{ .Values.springProfile | quote }}
  {{- range $key, $value := .Values.env }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
  APP_ENVIRONMENT: {{ .Values.environment | quote }}
